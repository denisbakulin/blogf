[project]
name = "blogf"
version = "0.1.0"
description = "blogf - blog and forum"
authors = [
    {name = "Denis Bakulin", email = "dtorkon@yandex.ru"}
]
requires-python = ">=3.12,<3.15"

dependencies = [
    # --- API ---
    "fastapi (>=0.115.0,<0.116.0)",
    "uvicorn[standard] (>=0.30.0,<0.31.0)",

    # --- Database ---
    "sqlalchemy (>=2.0.30,<3.0.0)",
    "aiosqlite (>=0.20.0,<0.21.0)",

    # --- HTTP ---
    "httpx (>=0.27.0,<0.28.0)",

    # --- Auth ---
    "python-jose (>=3.3.0,<4.0.0)",

    # --- Pydantic (зафиксировано стабильно) ---
    "pydantic (>=2.9.2,<2.10.0)",
    "pydantic-settings (>=2.4.0,<2.5.0)",

    # --- Messaging ---
    "redis (>=5.0.4,<6.0.0)",
    "faststream[redis] (>=0.5.5,<0.6.0)",

    # --- Cache ---
    "fastapi-cache2 (>=0.2.2,<0.3.0)",

    # --- Telegram ---
    "aiogram (>=3.5.0,<4.0.0)",

    # --- Utils ---
    "loguru (>=0.7.2,<0.8.0)",
    "unidecode (>=1.3.8,<2.0.0)",
    "authlib (>=1.6.9,<2.0.0)",
    "aiolimiter (>=1.2.1,<2.0.0)",
    "tenacity (>=9.1.4,<10.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "isort (>=5.13.0,<6.0.0)",
    "black (>=24.0.0,<25.0.0)",
    "faker (>=40.8.0,<41.0.0)",
    "ruff (>=0.15.6,<0.16.0)"
]


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true


[tool.ruff.format]
quote-style = "double"


