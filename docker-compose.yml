services:
#Переписать говн
  redis:
    container_name: redis
    image: redis:7
    ports:
      - "6379:6379"


  backend:
    container_name: backend
    build: .
    env_file: ./envs/.env.backend
    ports:
      - "8000:8000"
    depends_on:
      - redis

  bot:
    image: python
    build: .
    container_name: bot
    env_file: ./envs/.env.bot
    command: python -m interfaces.bot.main
    depends_on:
      - backend


